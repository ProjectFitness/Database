[project]
name = "thesis-check"
version = "0.1.0"
description = "Stress-test a trade thesis against live macro and market data using Claude"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.92.0",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "respx>=0.21",
]

[project.scripts]
thesis-check = "thesis_check.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["thesis_check*"]
